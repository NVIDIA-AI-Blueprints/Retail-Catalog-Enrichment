[project]
name = "catalog-bench"
version = "1.1.0"
description = "Batch LLM catalog enrichment: throughput benchmark and capacity sizing"
readme = "README.md"
requires-python = ">=3.10"

# TensorRT-LLM is deliberately NOT a dependency. It is only importable inside the TRT-LLM
# container on a GPU node, and making it a hard dep would mean this could not be installed
# on a laptop — which is where the generator, the token accounting, the schema check and
# the capacity model all live.
dependencies = [
    "pyarrow>=17",
    "numpy>=1.26",
    "jinja2>=3.1",
    "jsonschema>=4.21",
    "tokenizers>=0.20",
    "psutil>=6.0",
]

[project.optional-dependencies]
# Only resolvable on a GPU node.
gpu = ["tensorrt_llm"]
# For --engine http against NIM, vLLM or SGLang.
serve = ["requests>=2.31"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
catalog-bench = "catalog_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_bench"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
