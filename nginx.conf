events {
    worker_connections 1024;
}

http {

    client_max_body_size 10M;

    # Share one per-client budget across the GPU/LLM-intensive API routes.
    map $uri $expensive_api_client {
        default "";
        ~^/api/(vlm/analyze|generate/(variation|3d))$ $binary_remote_addr;
    }
    limit_req_zone $expensive_api_client zone=expensive_api_rate:10m rate=5r/m;
    limit_conn_zone $expensive_api_client zone=expensive_api_connections:10m;

    upstream frontend {
        server frontend:3000;
    }
    
    upstream backend {
        server backend:8000;
    }
    
    server {
        listen 80;
        
        # Frontend (includes WebSocket support for Next.js hot reload)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket handling for Next.js HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # Backend API routes
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            limit_req zone=expensive_api_rate burst=2 nodelay;
            limit_req_status 429;
            limit_conn expensive_api_connections 2;
            limit_conn_status 429;
            
            # Disable buffering for streaming responses
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            
            # Increase timeouts for long-running requests (image/3D generation)
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
